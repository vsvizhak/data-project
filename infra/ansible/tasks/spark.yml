- name: "Ensure services/spark/conf directory exists"
  file:
    path: "{{ project_dir }}/services/spark/conf"
    state: directory
    mode: '0755'

- name: "Deploy spark-defaults.conf from template"
  template:
    src: spark-defaults.conf.j2
    dest: "{{ project_dir }}/services/spark/conf/spark-defaults.conf"
    mode: '0644'
