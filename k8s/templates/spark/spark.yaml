apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: data-platform
data:
  spark-defaults.conf: |
    spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.demo                       org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.demo.type                  rest
    spark.sql.catalog.demo.uri                   http://iceberg-rest:8181
    spark.sql.catalog.demo.io-impl               org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.demo.warehouse             s3://warehouse/
    spark.sql.catalog.demo.s3.endpoint           http://minio:9000
    spark.sql.catalog.demo.s3.path-style-access  true
    spark.sql.defaultCatalog                     demo
    spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint                 http://minio:9000
    spark.hadoop.fs.s3a.path.style.access        true
    spark.hadoop.fs.s3a.connection.ssl.enabled   false
    spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.jars.packages                          org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.367
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
  template:
    metadata:
      labels:
        app: spark
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.spark }}
      containers:
        - name: spark
          image: {{ .Values.images.spark }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: minio-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: minio-secret-key
            - name: AWS_REGION
              value: us-east-1
          ports:
            - containerPort: 8888   # Jupyter
            - containerPort: 8080   # Spark UI
            - containerPort: 10000
            - containerPort: 10001
          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: notebooks
              mountPath: /home/iceberg/notebooks/notebooks
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
        - name: notebooks
          hostPath:
            path: /data/spark/notebooks
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: spark
  namespace: data-platform
spec:
  type: NodePort
  selector:
    app: spark
  ports:
    - name: jupyter
      port: 8888
      targetPort: 8888
      nodePort: 30088
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30081
