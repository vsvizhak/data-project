# ─── App ──────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: app
          image: {{ .Values.images.app }}
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: data-platform
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
---
# ─── dbt ──────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbt
  template:
    metadata:
      labels:
        app: dbt
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: dbt
          image: {{ .Values.images.dbt }}
          command: ["sleep", "infinity"]
          env:
            - name: DBT_PROFILES_DIR
              value: /app
          volumeMounts:
            - name: pipelines
              mountPath: /app
      volumes:
        - name: pipelines
          hostPath:
            path: /data/dbt
            type: DirectoryOrCreate
---
# ─── Flyway migrations ────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: flyway
  namespace: data-platform
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: {{ .Values.images.flyway }}
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://postgres-source:5432/$(PG_DBNAME)
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-user
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-password
            - name: PG_DBNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-dbname
          args: ["migrate"]
          volumeMounts:
            - name: sql
              mountPath: /flyway/sql/migration
              subPath: migration
            - name: sql
              mountPath: /flyway/sql/proc
              subPath: proc
            - name: flyway-conf
              mountPath: /flyway/conf
      volumes:
        - name: sql
          hostPath:
            path: /data/source_db
            type: DirectoryOrCreate
        - name: flyway-conf
          hostPath:
            path: /data/flyway/conf
            type: DirectoryOrCreate
---
# ─── src-faker ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-faker
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: src-faker
  template:
    metadata:
      labels:
        app: src-faker
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: src-faker
          image: {{ .Values.images.faker }}
          env:
            - name: DB_HOST
              value: postgres-source
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: pg-password
            - name: FAKER_BATCH_SIZE
              value: "10"
            - name: FAKER_INTERVAL_SEC
              value: "30"
