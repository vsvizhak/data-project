# ─── Postgres for Airflow ─────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/airflow-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.nodes.airflow }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-postgres-pvc
  namespace: data-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: airflow-postgres-pv
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
  namespace: data-platform
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: postgres
          image: {{ .Values.images.airflowPostgres }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-db
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airflow-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: data-platform
spec:
  selector:
    app: airflow-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ─── Airflow init (DB migrate + create admin user) ────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: data-platform
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: {{ .Values.images.airflow }}
          command:
            - /bin/bash
            - -c
            - |
              airflow db migrate
              airflow users create \
                --username $AIRFLOW_WWW_USER \
                --password $AIRFLOW_WWW_PASSWORD \
                --firstname Admin \
                --lastname Admin \
                --role Admin \
                --email admin@example.com || true
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(AIRFLOW_POSTGRES_USER):$(AIRFLOW_POSTGRES_PASSWORD)@airflow-postgres/$(AIRFLOW_POSTGRES_DB)
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-fernet-key
            - name: AIRFLOW_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-user
            - name: AIRFLOW_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-password
            - name: AIRFLOW_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-db
            - name: AIRFLOW_WWW_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-www-user
            - name: AIRFLOW_WWW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-www-password
---
# ─── Airflow Webserver ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: webserver
          image: {{ .Values.images.airflow }}
          command: ["airflow", "webserver"]
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(AIRFLOW_POSTGRES_USER):$(AIRFLOW_POSTGRES_PASSWORD)@airflow-postgres/$(AIRFLOW_POSTGRES_DB)
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-fernet-key
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
            - name: AIRFLOW_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-user
            - name: AIRFLOW_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-password
            - name: AIRFLOW_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-db
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: dags
          hostPath:
            path: /data/airflow/dags
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: data-platform
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# ─── Airflow Scheduler ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodes.airflow }}
      containers:
        - name: scheduler
          image: {{ .Values.images.airflow }}
          command: ["airflow", "scheduler"]
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(AIRFLOW_POSTGRES_USER):$(AIRFLOW_POSTGRES_PASSWORD)@airflow-postgres/$(AIRFLOW_POSTGRES_DB)
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-fernet-key
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-user
            - name: AIRFLOW_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-password
            - name: AIRFLOW_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: airflow-postgres-db
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: dags
          hostPath:
            path: /data/airflow/dags
            type: DirectoryOrCreate
