name: Build & Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - "services/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set TAG
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/data-platform-app:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/data-platform-app:main

      - name: Build & push dbt-trino image
        uses: docker/build-push-action@v6
        with:
          context: ./services/dbt
          file: ./services/dbt/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dbt-trino-app:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dbt-trino-app:main

      - name: Build & push kafka-connect image
        uses: docker/build-push-action@v6
        with:
          context: ./services/kafka-connect
          file: ./services/kafka-connect/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kafka-connect-custom:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kafka-connect-custom:main

      - name: Build & push src-faker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/source_db/faker
          file: ./services/source_db/faker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/src-faker:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/src-faker:main

      - name: Deploy via Helm
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          kubectl delete job minio-init airflow-init flyway -n data-platform --ignore-not-found=true

          cat > /tmp/values.secret.yaml <<'EOF'
          ${{ secrets.HELM_VALUES_SECRET }}
          EOF

          helm upgrade --install data-platform ./k8s \
            --namespace data-platform \
            --create-namespace \
            -f /tmp/values.secret.yaml
